[project]
name = "hastty"
version = "0.1.2"
description = "A terminal (TUI) viewer for your Home Assistant dashboards, with keyboard shortcuts to trigger commands."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "jmleclercq" }]
requires-python = ">=3.10"
keywords = ["home-assistant", "homeassistant", "tui", "terminal", "lovelace", "dashboard", "textual", "smart-home"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Terminals",
]
dependencies = [
    "textual>=0.58.0",
    "aiohttp>=3.9",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/jmleclercq/hastty"
Repository = "https://github.com/jmleclercq/hastty"
Issues = "https://github.com/jmleclercq/hastty/issues"
Changelog = "https://github.com/jmleclercq/hastty/releases"

[project.scripts]
hastty = "hastty.__main__:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hastty*"]
